[workspace]
resolver = "3"
members = ["backend", "interpreter"]

[workspace.package]
edition = "2024"
version = "0.1.0"
description = "Suite for parsing and running .die files"
authors = ["nenikitov"]

[workspace.lints]
clippy.pedantic = { level = "warn", priority = -1 }
clippy.double_must_use = "allow"
clippy.missing_errors_doc = "allow"
clippy.missing_panics_doc = "allow"
clippy.module_inception = "allow"
clippy.single_match_else = "allow"
clippy.struct_field_names = "allow"
clippy.too_many_lines = "allow"
clippy.wildcard_imports = "allow"
